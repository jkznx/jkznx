    <rect x="48" y="15" width="5" height="10"><animate attributeName="y" values="15;3;15;9;15" dur="1.08s" begin="-.71s" repeatCount="indefinite" /><animate attributeName="height" values="10;34;10;22;10" dur="1.08s" begin="-.71s" repeatCount="indefinite" /></rect>
