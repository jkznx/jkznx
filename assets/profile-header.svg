<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Jukrachai Plongmai — Computer Engineer</title>
  <desc id="description">An animated black profile header for Jukrachai Plongmai, Computer Engineer, with lime green and lavender gradients.</desc>
  <defs>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#030504" />
      <stop offset="0.54" stop-color="#0a0f0d" />
      <stop offset="1" stop-color="#17101b" />
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#B7E778" />
      <stop offset="1" stop-color="#AE75DA" />
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e9e7df" stroke-opacity=".055" />
    </pattern>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="typing-clip">
      <rect x="70" y="142" width="0" height="76">
        <animate attributeName="width" values="0;0;735;735;0;0" keyTimes="0;.11;.55;.82;.92;1" dur="6s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>
  <rect width="1200" height="320" fill="url(#field)" />
  <rect width="1200" height="320" fill="url(#grid)" />
  <circle cx="1050" cy="-30" r="225" fill="#AE75DA" fill-opacity=".1" />
  <circle cx="1048" cy="-30" r="128" fill="none" stroke="#B7E778" stroke-opacity=".35" />
