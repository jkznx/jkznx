    <rect x="24" y="12" width="5" height="16"><animate attributeName="y" values="12;2;12;6;12" dur=".92s" begin="-.34s" repeatCount="indefinite" /><animate attributeName="height" values="16;36;16;28;16" dur=".92s" begin="-.34s" repeatCount="indefinite" /></rect>
